name: Firstmate checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      # No typecheck script in package.json; call tsc directly (tsconfig.json covers server, rpc, lib).
      - run: npx tsc --noEmit
      - name: probe
        run: |
          native="$RUNNER_TEMP/firstmate-native"
          git init -q "$native"
          git -C "$native" remote add origin https://github.com/kunchenguid/firstmate.git
          git -C "$native" fetch -q --depth=1 origin "$(cat overlay/patch-base.txt)"
          git -C "$native" checkout -q --detach FETCH_HEAD
          python3 overlay/install-bb-backend.py --home "$native"
          export FM_TEST_HOME="$native" FM_CLASSIFY_LIB="$native/bin/fm-classify-lib.sh"
          for f in $(node -p "require('./package.json').scripts.test.split(/\s+/).filter(t=>/\.test\.(ts|mjs)$/.test(t)).join(' ')"); do
            if node --test --experimental-strip-types $f >/tmp/o.log 2>&1; then echo "PASS $f $(grep -E '^ℹ skipped' /tmp/o.log)"; else echo "FAIL $f"; fi
          done
      - run: npm run fidelity
