name: Firstmate checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      # package.json has no typecheck script; call tsc directly (tsconfig.json covers server, rpc, lib).
      - run: npx tsc --noEmit
      - run: npm run fidelity
      # Pinned upstream firstmate checkout, so native-parity tests such as
      # lib/policy.differential.test.ts run against the real native scripts.
      - name: Prepare native firstmate checkout
        run: |
          native="$RUNNER_TEMP/firstmate-native"
          git init -q "$native"
          git -C "$native" remote add origin https://github.com/kunchenguid/firstmate.git
          git -C "$native" fetch -q --depth=1 origin "$(cat overlay/patch-base.txt)"
          git -C "$native" checkout -q --detach FETCH_HEAD
          python3 overlay/install-bb-backend.py --home "$native"
          echo "FM_TEST_HOME=$native" >> "$GITHUB_ENV"
          echo "FM_CLASSIFY_LIB=$native/bin/fm-classify-lib.sh" >> "$GITHUB_ENV"
      # `npm test` lists every test file explicitly. Files below need a full
      # host (installed no-mistakes/tasks-axi/quota-axi/bb CLIs and a checkout at
      # /root/github_projects/firstmate) and cannot pass on a clean runner.
      # Everything else in the package.json list runs. Follow-up: make them
      # runnable here, then delete this list.
      - name: Run tests that need no host tools
        run: |
          host_only="server.test.ts lib/launch-delivery.test.mjs scripts/prompt-inbox.test.mjs scripts/native-compat.test.mjs scripts/launch-adoption.test.mjs server.wake-command-size.test.mjs server.queue-storage.test.mjs server.explicit-execution.test.mjs server.captain-startup.test.mjs scripts/captain-startup-native.test.mjs scripts/native-runtime.test.mjs server.native-runtime.test.mjs server.native-policy.test.mjs scripts/plugin-package-discovery.test.mjs server.native-crew-state.test.mjs scripts/worker-checkpoint.test.mjs"
          files=$(node -e '
            const skip = new Set(process.argv[1].split(" "));
            const all = JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts.test.split(/\s+/).filter((t) => /\.test\.(ts|mjs)$/.test(t));
            console.log(all.filter((f) => !skip.has(f)).join(" "));
          ' "$host_only")
          echo "Running $(echo $files | wc -w) test files"
          node --test --experimental-strip-types $files
