name: Firstmate checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      # No typecheck script in package.json; call tsc directly (tsconfig.json covers server, rpc, lib).
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run fidelity
